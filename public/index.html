<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Sign Up & Login - Bridging the Gap</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" integrity="sha512-SnH5WK+bZxgPHs44uWIX+LLJAJ9/2PkPKZ5QiAj6Ta86w+fsb2TkcmfRyVX3pBnMFcV7oQPJkl9QevSCWr3W6A==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
    
    <style>
        :root {
            --font-primary: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            --transition-smooth: 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);
            --border-radius-main: 18px;
            --border-radius-small: 12px;
            --shadow-strong: 0 8px 32px rgba(0, 0, 0, 0.25);
            --backdrop-blur-value: 12px;
        }

        html[data-theme='light'] {
            --c-text-primary: #1d1d1f;
            --c-text-on-glass: #000;
            --c-text-secondary: #515154;
            --c-text-accent: #007aff;
            --c-bg-glass: rgba(255, 255, 255, 0.6);
            --c-border-glass: rgba(60, 60, 67, 0.2);
            --c-bg-btn: #007aff;
            --c-text-btn: #ffffff;
            --c-bg-btn-admin: #c62828;
            --c-bg-input: rgba(0, 0, 0, 0.05);
            --c-status-success: #28a745;
            --c-status-error: #d32f2f;
        }

        html[data-theme='dark'] {
            --c-text-primary: #f5f5f7;
            --c-text-on-glass: #fff;
            --c-text-secondary: #8e8e93;
            --c-text-accent: #0a84ff;
            --c-bg-glass: rgba(28, 28, 30, 0.5);
            --c-border-glass: rgba(84, 84, 88, 0.5);
            --c-bg-btn: #0a84ff;
            --c-text-btn: #ffffff;
            --c-bg-btn-admin: #d32f2f;
            --c-bg-input: rgba(255, 255, 255, 0.1);
            --c-status-success: #32d74b;
            --c-status-error: #ff453a;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: var(--font-primary);
            background-color: #000; 
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 1rem;
            position: relative;
        }
        
        .background-container {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: url('https://res.cloudinary.com/ddkisbcrp/image/upload/f_auto,q_auto/v1/anime/aftuw166jigihk5ziykl') no-repeat center center;
            background-size: cover;
            z-index: -1;
        }
        .background-gradient {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(45deg, rgba(118, 75, 162, 0.3), rgba(102, 126, 234, 0.3), rgba(118, 75, 162, 0.3));
            background-size: 200% 200%;
            animation: gradient-animation 15s ease infinite;
        }
        @keyframes gradient-animation {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .flip-card {
            background-color: transparent;
            width: 440px;
            max-width: 100%;
            height: 600px; 
            perspective: 1500px;
        }
        .flip-card-inner {
            position: relative;
            width: 100%;
            height: 100%;
            transition: transform 0.8s;
            transform-style: preserve-3d;
        }
        .flip-card.is-flipped .flip-card-inner {
            transform: rotateY(180deg);
        }
        .flip-card-front, .flip-card-back {
            position: absolute;
            width: 100%;
            height: 100%;
            -webkit-backface-visibility: hidden; 
            backface-visibility: hidden;
            background: var(--c-bg-glass);
            border: 1px solid var(--c-border-glass);
            backdrop-filter: blur(var(--backdrop-blur-value));
            border-radius: var(--border-radius-main);
            box-shadow: var(--shadow-strong);
            padding: 40px;
            color: var(--c-text-on-glass);
            display: flex;
            flex-direction: column;
        }
        .flip-card-back {
            transform: rotateY(180deg);
        }

        h1 {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            text-align:center;
        }
        .toggle-form {
            display: block;
            color: var(--c-text-accent);
            font-weight: 500;
            margin-bottom: 2rem;
            cursor: pointer;
            transition: color 0.3s;
            text-align: center;
        }
        .toggle-form:hover { text-decoration: underline; }

        form {
            display: flex;
            flex-direction: column;
            flex-grow: 1; 
        }
        .form-content { flex-grow: 1; }
        .form-group { margin-bottom: 1rem; }
        .form-row { display: flex; gap: 1rem; }
        .form-row .form-group { flex: 1; }

        label {
            display: block;
            font-weight: 500;
            margin-bottom: 0.5rem;
            color: var(--c-text-secondary);
        }
        input[type="text"], input[type="email"], input[type="password"] {
            width: 100%;
            padding: 12px;
            background: var(--c-bg-input);
            border: 1px solid transparent;
            border-radius: var(--border-radius-small);
            font-size: 1rem;
            color: var(--c-text-primary);
            font-family: var(--font-primary);
            outline: none;
            transition: all var(--transition-smooth);
        }
        input::placeholder { color: var(--c-text-secondary); }
        input:focus { border-color: var(--c-text-accent); background: transparent; }
        
        .password-container { position: relative; }
        .toggle-password {
            position: absolute;
            right: 12px; top: 50%; transform: translateY(-50%);
            color: var(--c-text-secondary);
            cursor: pointer;
        }
        
        #forgot-password {
            display: block; text-align: right; color: var(--c-text-accent);
            font-size: 0.9rem; margin-top: 0.5rem; text-decoration: none;
        }

        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: var(--border-radius-small);
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all var(--transition-smooth);
            margin-top: 1rem;
        }
        .primary-btn { background: var(--c-bg-btn); color: var(--c-text-btn); }
        .primary-btn:hover { opacity: 0.85; transform: translateY(-2px); }
        #admin-login-btn { background: var(--c-bg-btn-admin); color: var(--c-text-btn); }
        
        #status-message {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            padding: 10px 20px;
            background: var(--c-bg-glass);
            border: 1px solid var(--c-border-glass);
            border-radius: var(--border-radius-small);
            font-weight: 500;
            text-align: center;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.4s, visibility 0.4s;
            z-index: 100;
            max-width: 90%;
        }
        #status-message.show { opacity: 1; visibility: visible; }
        #status-message.success { color: var(--c-status-success); }
        #status-message.error { color: var(--c-status-error); }
        
        /* --- MOBILE VIEW   --- */
        @media (max-width: 480px) {
          .flip-card-front,
          .flip-card-back {
            background-color: rgba(255, 255, 255, 0.4) !important;
          }
          html[data-theme='dark'] .flip-card-front,
          html[data-theme='dark'] .flip-card-back {
            background-color: rgba(28, 28, 30, 0.4) !important;
          }

          input[type="text"],
          input[type="email"],
          input[type="password"] {
            background-color: rgba(255, 255, 255, 0.4) !important;
            color: var(--c-text-primary) !important;
          }
          html[data-theme='dark'] input[type="text"],
          html[data-theme='dark'] input[type="email"],
          html[data-theme='dark'] input[type="password"] {
            background-color: rgba(255, 255, 255, 0.02) !important;
          }

          .flip-card-front,
          .flip-card-back,
          label,
          input::placeholder {
            color: var(--c-text-primary) !important;
          }
        }


    </style>
</head>
<body>
    <div class="background-container">
        <div class="background-gradient"></div>
    </div>

    <div class="flip-card" id="flip-card">
        <div class="flip-card-inner">
            
            <div class="flip-card-front">
                <h1>Welcome Back.</h1>
                <span id="toggle-to-signup" class="toggle-form">No account? Create one</span>
                <form id="login-form">
                    <div class="form-content">
                        <div class="form-group">
                            <label for="login-email">Email</label>
                            <input type="email" id="login-email" required placeholder="your.email@example.com" />
                        </div>
                        <div class="form-group">
                            <label for="login-password">Password</label>
                            <div class="password-container">
                                <input type="password" id="login-password" required placeholder="Enter your password" />
                                <i class="fas fa-eye toggle-password" id="toggle-login-password"></i>
                            </div>
                            <a href="#" id="forgot-password">Forgot Password?</a>
                        </div>
                    </div>
                    <div class="form-actions">
                        <button type="submit" class="primary-btn">Login</button>
                        <button type="button" id="admin-login-btn">Admin Login</button>
                    </div>
                </form>
            </div>

            <div class="flip-card-back">
                <h1>Create Account.</h1>
                <span id="toggle-to-login" class="toggle-form">Already a member? Log in</span>
                <form id="signup-form">
                    <div class="form-content">
                        <div class="form-row">
                            <div class="form-group">
                                <label for="signup-firstname">First name</label>
                                <input type="text" id="signup-firstname" required />
                            </div>
                            <div class="form-group">
                                <label for="signup-lastname">Last name</label>
                                <input type="text" id="signup-lastname" required />
                            </div>
                        </div>
                        <div class="form-group">
                            <label for="signup-email">Email</label>
                            <input type="email" id="signup-email" required placeholder="your.email@example.com" />
                        </div>
                        <div class="form-group">
                            <label for="signup-password">Password</label>
                            <div class="password-container">
                                <input type="password" id="signup-password" required placeholder="At least 6 characters" />
                                <i class="fas fa-eye toggle-password" id="toggle-signup-password"></i>
                            </div>
                        </div>
                    </div>
                    <div class="form-actions">
                        <button type="submit" class="primary-btn">Create Account</button>
                    </div>
                </form>
            </div>

        </div>
    </div>
    
    <div id="status-message"></div>

    <script>
        (function() {
            const savedTheme = localStorage.getItem('theme') || 'light';
            document.documentElement.setAttribute('data-theme', savedTheme);
        })();

        document.addEventListener("DOMContentLoaded", () => {
            const firebaseConfig = {
                apiKey: "AIzaSyD9Y_saGbwRdVsJr_zyFjwAayY8dkBUrXg",
                authDomain: "bridging-the-gap-af65a.firebaseapp.com",
                projectId: "bridging-the-gap-af65a",
                storageBucket: "bridging-the-gap-af65a.appspot.com",
                messagingSenderId: "608387568756",
                appId: "1:608387568756:web:a563a78ea0e6e61d3dad21",
            };
            firebase.initializeApp(firebaseConfig);
            const auth = firebase.auth();
            const db = firebase.firestore();

            const flipCard = document.getElementById('flip-card');
            const toggleToLogin = document.getElementById('toggle-to-login');
            const toggleToSignup = document.getElementById('toggle-to-signup');
            const statusMessage = document.getElementById('status-message');
            let adminLoginAttempted = false;

            toggleToLogin.addEventListener('click', () => {
                flipCard.classList.remove('is-flipped');
                showStatus('', 'success', 1); 
            });
            toggleToSignup.addEventListener('click', () => {
                flipCard.classList.add('is-flipped');
                showStatus('', 'success', 1); 
            });

            let statusTimeout;
            const showStatus = (message, type, duration = 6000) => {
                clearTimeout(statusTimeout);
                statusMessage.textContent = message;
                statusMessage.className = `show ${type}`;
                if (duration) {
                    statusTimeout = setTimeout(() => statusMessage.classList.remove('show'), duration);
                }
            };

            const togglePasswordVisibility = (input, icon) => {
                const type = input.getAttribute('type') === 'password' ? 'text' : 'password';
                input.setAttribute('type', type);
                icon.classList.toggle('fa-eye');
                icon.classList.toggle('fa-eye-slash');
            };
            
            document.getElementById('toggle-signup-password').addEventListener('click', (e) => togglePasswordVisibility(document.getElementById('signup-password'), e.target));
            document.getElementById('toggle-login-password').addEventListener('click', (e) => togglePasswordVisibility(document.getElementById('login-password'), e.target));

            // --- 4. FIREBASE AUTH LOGIC ---
            document.getElementById('signup-form').addEventListener('submit', (e) => {
                e.preventDefault();
                const firstName = document.getElementById('signup-firstname').value;
                const lastName = document.getElementById('signup-lastname').value;
                const email = document.getElementById('signup-email').value;
                const password = document.getElementById('signup-password').value;
                const fullName = `${firstName} ${lastName}`.trim();

                auth.createUserWithEmailAndPassword(email, password)
                    .then(userCredential => {
                        const user = userCredential.user;
                        return user.updateProfile({ displayName: fullName })
                            .then(() => {
                                db.collection('users').doc(user.uid).set({
                                    firstName: firstName, lastName: lastName, email: user.email,
                                    createdAt: firebase.firestore.FieldValue.serverTimestamp()
                                });
                                return user;
                            });
                    })
                    .then(user => {
                        user.sendEmailVerification();
                        showStatus(`Account created! A verification link was sent to ${user.email}. Check your inbox. This page will auto-refresh once you've verified.`, 'success', null);
                        
                        const verificationInterval = setInterval(() => {
                            user.reload().then(() => {
                                if (user.emailVerified) {
                                    clearInterval(verificationInterval);
                                    showStatus('Email verified! Logging you in...', 'success', 3000);
                                    setTimeout(() => window.location.href = "dashboard.html", 2000);
                                }
                            });
                        }, 3000);
                    })
                    .catch(error => showStatus(error.message, 'error'));
            });

            // LOGIN
            document.getElementById('login-form').addEventListener('submit', (e) => {
                e.preventDefault();
                adminLoginAttempted = false;
                const email = document.getElementById('login-email').value;
                const password = document.getElementById('login-password').value;

                auth.signInWithEmailAndPassword(email, password)
                    .then(userCredential => {
                        if (userCredential.user.emailVerified) {
                            showStatus('Login successful! Redirecting...', 'success', 2000);
                            setTimeout(() => window.location.href = "dashboard.html", 1500);
                        } else {
                            auth.signOut();
                            showStatus('Please verify your email. A new link has been sent.', 'error');
                            userCredential.user.sendEmailVerification();
                        }
                    })
                    .catch(error => showStatus(error.message, 'error'));
            });

            // ADMIN LOGIN
            document.getElementById('admin-login-btn').addEventListener('click', () => {
                adminLoginAttempted = true;
                const email = document.getElementById('login-email').value;
                const password = document.getElementById('login-password').value;

                if (!email || !password) {
                    return showStatus("Enter email and password for admin login.", "error");
                }

                auth.signInWithEmailAndPassword(email, password)
                    .then(userCredential => {
                        if (!userCredential.user.emailVerified) {
                            auth.signOut();
                            return showStatus('Admin account must be email verified.', 'error');
                        }
                        return db.collection('admins').doc(userCredential.user.uid).get();
                    })
                    .then(doc => {
                        if (doc && doc.exists && doc.data().role === 'admin') {
                            showStatus('Admin login successful! Redirecting...', 'success', 2000);
                            setTimeout(() => window.location.href = "admin_dashboard.html", 1500);
                        } else if (doc) {
                            auth.signOut();
                            showStatus('Access Denied. Not an admin account.', 'error');
                        }
                    })
                    .catch(error => showStatus(error.message, 'error'));
            });

            // FORGOT PASSWORD
            document.getElementById('forgot-password').addEventListener('click', (e) => {
                e.preventDefault();
                const email = document.getElementById('login-email').value;
                if (!email) {
                    return showStatus('Please enter your email address to reset password.', 'error');
                }
                auth.sendPasswordResetEmail(email)
                    .then(() => showStatus(`Password reset link sent to ${email}.`, 'success'))
                    .catch(error => showStatus(error.message, 'error'));
            });

            auth.onAuthStateChanged(user => {
                if (user && user.emailVerified) {
                    if (!adminLoginAttempted) {
                        db.collection('admins').doc(user.uid).get().then(doc => {
                            if (!doc.exists || doc.data().role !== 'admin') {
                                window.location.href = "dashboard.html";
                            }
                        });
                    }
                }
            });
        
            window.onpopstate = function() {
                if (!auth.currentUser) {
                    window.location.replace("index.html");
                }
            };
        });
    </script>
</body>
</html>
