<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Add Scheme - Admin Panel</title>

    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="512x512" href="/favicon-512x512.png">
    <link rel="shortcut icon" href="/favicon.ico">
    
    <script>
      (function() {
        const savedTheme = localStorage.getItem('theme');
        const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (savedTheme) {
          document.documentElement.setAttribute('data-theme', savedTheme);
        } else {
          document.documentElement.setAttribute('data-theme', prefersDark ? 'dark' : 'light');
        }
      })();
    </script>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" integrity="sha512-SnH5WK+bZxgPHs44uWIX+LLJAJ9/2PkPKZ5QiAj6Ta86w+fsb2TkcmfRyVX3pBnMFcV7oQPJkl9QevSCWr3W6A==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    
    <style>
        :root {
            --font-primary: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            --transition-smooth: 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            --border-radius-main: 18px;
            --border-radius-small: 12px;
            --shadow-soft: 0 4px 12px rgba(0, 0, 0, 0.1);
            --shadow-strong: 0 8px 24px rgba(0, 0, 0, 0.15);
            --backdrop-blur-value: 20px;
        }

        html[data-theme='light'] {
            --c-text-primary: #1d1d1f;
            --c-text-secondary: #515154;
            --c-text-accent: #007aff;
            --c-bg-glass: rgba(255, 255, 255, 0.75);
            --c-border-glass: rgba(60, 60, 67, 0.29);
            --c-bg-btn: #007aff;
            --c-text-btn: #ffffff;
            --c-bg-input: rgba(220, 220, 225, 0.5);
            --c-status-success: #34c759;
            --c-status-error: #ff3b30;
        }

        html[data-theme='dark'] {
            --c-text-primary: #f5f5f7;
            --c-text-secondary: #8e8e93;
            --c-text-accent: #0a84ff;
            --c-bg-glass: rgba(28, 28, 30, 0.75);
            --c-border-glass: rgba(84, 84, 88, 0.65);
            --c-bg-btn: #0a84ff;
            --c-text-btn: #ffffff;
            --c-bg-input: rgba(58, 58, 60, 0.5);
            --c-status-success: #30d158;
            --c-status-error: #ff453a;
        }

        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: var(--font-primary);
            background: url('https://res.cloudinary.com/ddkisbcrp/image/upload/f_auto,q_auto/v1/anime/bfvspaoqepxye0ddwdxt') no-repeat center center fixed;
            background-size: cover;
            color: var(--c-text-primary);
            line-height: 1.6;
        }

        /* HEADER */
        header {
            background: var(--c-bg-glass);
            backdrop-filter: blur(var(--backdrop-blur-value));
            border-bottom: 1px solid var(--c-border-glass);
            padding: 1rem 2rem;
            position: sticky;
            top: 0;
            z-index: 1000;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .header-logo { font-size: 1.5rem; font-weight: 700; }
        .header-nav a, .header-nav button {
            text-decoration: none;
            color: var(--c-text-primary);
            font-weight: 500;
            margin-left: 1.5rem;
            transition: color var(--transition-smooth);
            background: none;
            border: none;
            font-family: var(--font-primary);
            font-size: 1rem;
            cursor: pointer;
        }
        .header-nav a:hover, .header-nav button:hover { color: var(--c-text-accent); }
        .header-nav i { margin-right: 0.5rem; }

        .content-wrapper {
            max-width: 800px;
            margin: 2rem auto;
            padding: 0 1rem;
        }
        .admin-card {
            background: var(--c-bg-glass);
            backdrop-filter: blur(var(--backdrop-blur-value));
            border: 1px solid var(--c-border-glass);
            border-radius: var(--border-radius-main);
            padding: 2.5rem;
            box-shadow: var(--shadow-strong);
            animation: fadeInUp 0.6s ease-out;
        }
        .admin-card h2 {
            font-size: 1.8rem;
            margin-bottom: 2rem;
            text-align: center;
        }
        
        #add-scheme-form { display: grid; gap: 1.5rem; }
        .form-group { display: flex; flex-direction: column; }
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
        
        label { font-weight: 600; margin-bottom: 0.5rem; color: var(--c-text-secondary); }
        input, textarea, select {
            width: 100%; padding: 0.8rem 1rem;
            border-radius: var(--border-radius-small); border: 1px solid transparent; background: var(--c-bg-input);
            color: var(--c-text-primary); font-family: var(--font-primary); font-size: 1rem;
            transition: all var(--transition-smooth);
        }
        input:focus, textarea:focus, select:focus { 
            outline: none; border-color: var(--c-text-accent); background: transparent; 
        }
        textarea { resize: vertical; min-height: 100px; }
        
        .checkbox-group { display: flex; align-items: center; gap: 0.75rem; margin-top: 0.5rem; }
        input[type="checkbox"] { width: auto; accent-color: var(--c-text-accent); }

        #submit-btn {
            background: var(--c-bg-btn); color: var(--c-text-btn);
            border: none; border-radius: var(--border-radius-small); padding: 0.8rem;
            font-size: 1rem; font-weight: 600; cursor: pointer;
            transition: all var(--transition-smooth); margin-top: 1rem;
        }
        #submit-btn:hover:not(:disabled) { opacity: 0.85; transform: translateY(-2px); }
        #submit-btn:disabled { background: var(--c-text-secondary); cursor: wait; opacity: 0.5; }

        .status {
            text-align: center; margin-top: 1.5rem; font-weight: 500; height: 1.5rem;
            opacity: 0; transition: opacity 0.3s ease;
        }
        .status.show { opacity: 1; }
        .status.success { color: var(--c-status-success); }
        .status.error { color: var(--c-status-error); }

        @keyframes fadeInUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        
        @media (max-width: 600px) { .form-row { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
    <header>
        <div class="header-logo">Admin Panel</div>
        <nav class="header-nav">
            <a href="feedback.html"><i class="fas fa-comment-dots"></i> Manage Feedback</a>
            <button id="logoutBtn"><i class="fas fa-sign-out-alt"></i> Logout</button>
        </nav>
    </header>

    <main class="content-wrapper">
        <div class="admin-card">
            <h2>Add New Scheme</h2>
            <form id="add-scheme-form">
                <div class="form-group">
                    <label for="category">Category</label>
                    <select id="category" required>
                        <option value="farmers">Farmers</option>
                        <option value="students">Students</option>
                        <option value="health">Health</option>
                        <option value="sports">Sports</option>
                        <option value="other">Other</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="name">Scheme Name</label>
                    <input type="text" id="name" required placeholder="e.g., Pradhan Mantri Fasal Bima Yojana">
                </div>

                <div class="form-group">
                    <label for="description">Description</label>
                    <textarea id="description" required placeholder="A brief summary of the scheme..."></textarea>
                </div>

                <div class="form-group">
                    <label for="eligibility">Eligibility (one criterion per line)</label>
                    <textarea id="eligibility" required placeholder="e.g., All landholding farmer families are eligible."></textarea>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="startDate">Start Date</label>
                        <input type="date" id="startDate" required>
                    </div>
                    <div class="form-group">
                        <label for="endDate">End Date</label>
                        <input type="date" id="endDate">
                        <div class="checkbox-group">
                           <input type="checkbox" id="ongoing">
                           <label for="ongoing" style="margin-bottom: 0;">This scheme is ongoing</label>
                        </div>
                    </div>
                </div>

                <div class="form-group">
                    <label for="officialLink">Official Link</label>
                    <input type="url" id="officialLink" required placeholder="https://example.gov.in/scheme">
                </div>
                
                <button type="submit" id="submit-btn">Add Scheme</button>
                <p class="status" id="form-status"></p>
            </form>
        </div>
    </main>

    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            // -- 1. Firebase Setup --
            const firebaseConfig = {
                apiKey: "AIzaSyD9Y_saGbwRdVsJr_zyFjwAayY8dkBUrXg",
                authDomain: "bridging-the-gap-af65a.firebaseapp.com",
                projectId: "bridging-the-gap-af65a",
                storageBucket: "bridging-the-gap-af65a.appspot.com", 
                messagingSenderId: "608387568756",
                appId: "1:608387568756:web:a563a78ea0e6e61d3dad21",
            };
            firebase.initializeApp(firebaseConfig);
            const auth = firebase.auth();
            const db = firebase.firestore();

            const logoutBtn = document.getElementById("logoutBtn");
            const schemeForm = document.getElementById("add-scheme-form");
            const submitBtn = document.getElementById("submit-btn");
            const statusElem = document.getElementById("form-status");
            const ongoingCheckbox = document.getElementById("ongoing");
            const endDateInput = document.getElementById("endDate");
            
            let statusTimeout;

            // -- Admin Check --
            auth.onAuthStateChanged(user => {
                if (user && user.emailVerified) {
                    db.collection('admins').doc(user.uid).get().then(doc => {
                        if (!doc.exists || doc.data().role !== 'admin') {
                            auth.signOut();
                            window.location.href = "index.html";
                        }
                    }).catch(error => {
                        console.error("Admin check failed:", error);
                        auth.signOut();
                        window.location.href = "index.html";
                    });
                } else {
                    window.location.href = "index.html";
                }
            });

            logoutBtn.addEventListener("click", () => {
                auth.signOut().then(() => window.location.href = "index.html");
            });

            ongoingCheckbox.addEventListener("change", () => {
                endDateInput.disabled = ongoingCheckbox.checked;
                if (ongoingCheckbox.checked) {
                    endDateInput.value = "";
                }
            });

            schemeForm.addEventListener("submit", (e) => {
                e.preventDefault();
                submitBtn.disabled = true;
                submitBtn.textContent = "Saving...";

                const category = document.getElementById("category").value;
                const name = document.getElementById("name").value;
                const description = document.getElementById("description").value;
                const eligibility = document.getElementById("eligibility").value.split('\n').map(line => line.trim()).filter(line => line);
                const startDate = document.getElementById("startDate").value;
                const isOngoing = ongoingCheckbox.checked;
                const endDate = isOngoing ? null : document.getElementById("endDate").value;
                const officialLink = document.getElementById("officialLink").value;
                
                if (!isOngoing && !endDate) {
                    showStatus("Please provide an End Date or check 'Ongoing'.", "error");
                    submitBtn.disabled = false;
                    submitBtn.textContent = "Add Scheme";
                    return;
                }

                const schemeData = {
                    category,
                    name,
                    description,
                    eligibility,
                    officialLink,
                    startDate: firebase.firestore.Timestamp.fromDate(new Date(startDate)),
                    endDate: isOngoing || !endDate ? null : firebase.firestore.Timestamp.fromDate(new Date(endDate))
                };

                db.collection("schemes").add(schemeData)
                    .then(() => {
                        showStatus("Scheme added successfully!", "success");
                        schemeForm.reset();
                        endDateInput.disabled = false; 
                    })
                    .catch((error) => {
                        console.error("Error adding scheme:", error);
                        showStatus("Error: " + error.message, "error");
                    })
                    .finally(() => {
                        submitBtn.disabled = false;
                        submitBtn.textContent = "Add Scheme";
                    });
            });

            const showStatus = (message, type, duration = 4000) => {
                clearTimeout(statusTimeout);
                statusElem.textContent = message;
                statusElem.className = `status show ${type}`;
                if (duration) {
                    statusTimeout = setTimeout(() => statusElem.classList.remove('show'), duration);
                }
            };
        });
    </script>
</body>
</html>
