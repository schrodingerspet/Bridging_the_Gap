<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Feedback - Bridging the Gap</title>

    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="512x512" href="/favicon-512x512.png">
    <link rel="shortcut icon" href="/favicon.ico">

    <script>
      (function() {
        const savedTheme = localStorage.getItem('theme');
        const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (savedTheme) {
          document.documentElement.setAttribute('data-theme', savedTheme);
        } else {
          document.documentElement.setAttribute('data-theme', prefersDark ? 'dark' : 'light');
        }
      })();
    </script>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" integrity="sha512-SnH5WK+bZxgPHs44uWIX+LLJAJ9/2PkPKZ5QiAj6Ta86w+fsb2TkcmfRyVX3pBnMFcV7oQPJkl9QevSCWr3W6A==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    
    <style>
        :root {
            --font-primary: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            --transition-smooth: 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            --border-radius-main: 18px;
            --border-radius-small: 12px;
            --shadow-soft: 0 4px 12px rgba(0, 0, 0, 0.1);
            --shadow-strong: 0 8px 24px rgba(0, 0, 0, 0.15);
            --backdrop-blur-value: 20px;
        }

        html[data-theme='light'] {
            --c-text-primary: #1d1d1f;
            --c-text-secondary: #515154;
            --c-text-accent: #007aff;
            --c-bg-glass: rgba(255, 255, 255, 0.7);
            --c-border-glass: rgba(60, 60, 67, 0.29);
            --c-bg-btn: #007aff;
            --c-text-btn: #ffffff;
            --c-bg-input: rgba(220, 220, 225, 0.5);
            --c-status-success: #34c759;
            --c-status-error: #ff3b30;
        }

        html[data-theme='dark'] {
            --c-text-primary: #f5f5f7;
            --c-text-secondary: #8e8e93;
            --c-text-accent: #0a84ff;
            --c-bg-glass: rgba(28, 28, 30, 0.75);
            --c-border-glass: rgba(84, 84, 88, 0.65);
            --c-bg-btn: #0a84ff;
            --c-text-btn: #ffffff;
            --c-bg-input: rgba(58, 58, 60, 0.5);
            --c-status-success: #30d158;
            --c-status-error: #ff453a;
        }

        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: var(--font-primary);
            background: url('https://res.cloudinary.com/ddkisbcrp/image/upload/f_auto,q_auto/v1/anime/bfvspaoqepxye0ddwdxt') no-repeat center center fixed;
            background-size: cover;
            color: var(--c-text-primary);
            line-height: 1.6;
        }

        /* UI & LAYOUT */
        .top-ui-container {
            position: fixed; top: 1rem; left: 1rem; z-index: 1000;
            pointer-events: none;
        }
        .top-ui-container > * { pointer-events: auto; }
        .ui-btn {
            display: flex; align-items: center; justify-content: center; height: 44px;
            padding: 0 1rem; background: var(--c-bg-glass); color: var(--c-text-primary);
            text-decoration: none; border-radius: var(--border-radius-small); border: 1px solid var(--c-border-glass);
            backdrop-filter: blur(var(--backdrop-blur-value)); font-size: 0.9rem; font-weight: 500;
            transition: all var(--transition-smooth); cursor: pointer;
        }
        .ui-btn:hover { transform: translateY(-2px); box-shadow: var(--shadow-soft); }
        .back-to-dashboard.arrow { width: 44px; padding: 0; }
        .back-to-dashboard.arrow .text { display: none; }
        .back-to-dashboard:not(.arrow) .arrow-icon { display: none; }

        .content-wrapper {
            max-width: 800px; margin: 6rem auto 4rem; padding: 0 1rem;
            display: grid; gap: 2rem;
        }
        
        .feedback-card {
            background: var(--c-bg-glass); backdrop-filter: blur(var(--backdrop-blur-value));
            border: 1px solid var(--c-border-glass); border-radius: var(--border-radius-main);
            box-shadow: var(--shadow-strong); padding: 2rem;
            opacity: 0;
            animation: fadeInUp 0.8s ease-out forwards;
        }
        .feedback-card h2 {
            font-size: clamp(1.8rem, 4vw, 2.2rem); font-weight: 700;
            color: var(--c-text-primary); margin-bottom: 1.5rem; text-align: center;
        }
        
        /* FORM STYLES */
        form label { display: block; font-weight: 600; margin-bottom: 0.5rem; color: var(--c-text-secondary); }
        form input, form textarea {
            width: 100%; padding: 0.8rem 1rem; margin-bottom: 1rem;
            border-radius: var(--border-radius-small); border: 1px solid transparent; background: var(--c-bg-input);
            color: var(--c-text-primary); font-family: var(--font-primary); font-size: 1rem;
            transition: all var(--transition-smooth);
        }
        form input:focus, form textarea:focus { 
            outline: none; border-color: var(--c-text-accent); background: transparent; 
        }
        form button {
            width: 100%; padding: 0.8rem 1rem; background: var(--c-bg-btn); color: var(--c-text-btn);
            border: none; border-radius: var(--border-radius-small); font-size: 1rem; font-weight: 600;
            cursor: pointer; transition: all var(--transition-smooth);
        }
        form button:hover:not(:disabled) { opacity: 0.85; transform: translateY(-2px); }
        form button:disabled { background: var(--c-text-secondary); cursor: wait; opacity: 0.5; }
        .feedback-status {
            text-align: center; margin-top: 1rem; font-weight: 500; height: 1.5rem;
            opacity: 0; transition: opacity 0.3s ease;
        }
        .feedback-status.show { opacity: 1; }
        .feedback-status.success { color: var(--c-status-success); }
        .feedback-status.error { color: var(--c-status-error); }
        z
        #feedback-items { max-height: 500px; overflow-y: auto; padding-right: 10px; }
        .feedback-item {
            padding-bottom: 1rem; margin-bottom: 1rem; 
            border-bottom: 1px solid var(--c-border-glass);
        }
        .feedback-item:last-child { border-bottom: none; margin-bottom: 0; }
        .feedback-header { display: flex; justify-content: space-between; align-items: baseline; flex-wrap: wrap; gap: 0.5rem; }
        .feedback-header strong { font-size: 1.1rem; color: var(--c-text-primary); }
        .feedback-header span { font-size: 0.8rem; color: var(--c-text-secondary); }
        .feedback-item p { margin: 0.5rem 0; white-space: pre-wrap; word-wrap: break-word; }
        .admin-reply {
            margin-top: 0.75rem; padding: 0.75rem; background: var(--c-bg-input);
            border-radius: var(--border-radius-small); font-size: 0.9rem; border-left: 3px solid var(--c-text-accent);
        }
        .admin-reply strong { font-size: 0.9rem; color: var(--c-text-primary); display: block; margin-bottom: 0.25rem; }

        footer {
            background: var(--c-bg-glass); backdrop-filter: blur(var(--backdrop-blur-value));
            border-top: 1px solid var(--c-border-glass); padding: 2rem; margin-top: 4rem; text-align: center;
        }
        footer p { font-size: 0.9rem; color: var(--c-text-secondary); }
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>
    <div class="top-ui-container">
        <a href="dashboard.html" class="back-to-dashboard ui-btn">
            <span class="arrow-icon">&larr;</span>
            <span class="text">Back to Dashboard</span>
        </a>
    </div>

    <main class="content-wrapper">
        <div class="feedback-card" id="form-card" style="display: none;">
            <h2>We Value Your Feedback</h2>
            <form id="feedback-form">
                <label for="name">Name</label>
                <input type="text" id="name" required />
                
                <label for="email">Email</label>
                <input type="email" id="email" required />
                
                <label for="message">Message</label>
                <textarea id="message" rows="5" required placeholder="Share your thoughts, suggestions, or issues..."></textarea>
                
                <button type="submit" id="submit-btn">Send Feedback</button>
            </form>
            <p class="feedback-status" id="feedback-status"></p>
        </div>

        <div class="feedback-card" id="list-card">
            <h2>Recent Feedback</h2>
            <div id="feedback-items">
                <p>Loading feedback...</p>
            </div>
        </div>
    </main>

    <footer>
        <p>&copy; 2025 Bridging the Gap</p>
    </footer>

    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
    
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            // -- 1. Firebase Setup --
            const firebaseConfig = {
                apiKey: "AIzaSyD9Y_saGbwRdVsJr_zyFjwAayY8dkBUrXg",
                authDomain: "bridging-the-gap-af65a.firebaseapp.com",
                projectId: "bridging-the-gap-af65a",
                storageBucket: "bridging-the-gap-af65a.appspot.com",
                messagingSenderId: "608387568756",
                appId: "1:608387568756:web:a563a78ea0e6e61d3dad21",
                databaseURL: "https://bridging-the-gap-af65a-default-rtdb.firebaseio.com"
            };

            firebase.initializeApp(firebaseConfig);
            const auth = firebase.auth();
            const db = firebase.database();
            const feedbackRef = db.ref("feedback");

            // -- 2. DOM Element References --
            const formCard = document.getElementById("form-card");
            const feedbackForm = document.getElementById("feedback-form");
            const nameInput = document.getElementById("name");
            const emailInput = document.getElementById("email");
            const messageInput = document.getElementById("message");
            const submitBtn = document.getElementById("submit-btn");
            const statusElem = document.getElementById("feedback-status");
            const feedbackItemsContainer = document.getElementById("feedback-items");

            let statusTimeout;

            // -- 3. Utility Functions --
            const showStatus = (message, type, duration = 4000) => {
                clearTimeout(statusTimeout);
                statusElem.textContent = message;
                statusElem.className = `feedback-status show ${type}`;
                if (duration) {
                    statusTimeout = setTimeout(() => statusElem.classList.remove('show'), duration);
                }
            };
            
            const escapeHTML = (str) => {
                const p = document.createElement('p');
                p.textContent = str;
                return p.innerHTML;
            };

            auth.onAuthStateChanged(user => {
                if (user && user.emailVerified) {
                    formCard.style.display = 'block';
                    
                    nameInput.value = user.displayName || ''; 
                    emailInput.value = user.email || '';

                    feedbackRef.orderByChild('timestamp').limitToLast(15).on("value", snapshot => {
                        feedbackItemsContainer.innerHTML = "";
                        if (snapshot.exists()) {
                            const feedbacks = [];
                            snapshot.forEach(childSnapshot => {
                                feedbacks.push({ id: childSnapshot.key, ...childSnapshot.val() });
                            });
                            displayFeedback(feedbacks.reverse());
                        } else {
                            feedbackItemsContainer.innerHTML = "<p>No feedback yet. Be the first!</p>";
                        }
                    });
                } else {
                    formCard.style.display = 'none';
                    feedbackItemsContainer.innerHTML = `<p style="text-align: center; font-weight: 500;">Please log in to your dashboard to submit or view feedback.</p>`;
                }
            });

            feedbackForm.addEventListener("submit", (e) => {
                e.preventDefault();

                const name = nameInput.value.trim();
                const email = emailInput.value.trim();
                const message = messageInput.value.trim();
                
                if (!name || !email || !message) {
                    showStatus("All fields are required.", "error");
                    return;
                }

                submitBtn.disabled = true;
                submitBtn.textContent = "Sending...";

                const feedbackData = {
                    name: name, 
                    email: email, 
                    message: message,
                    timestamp: firebase.database.ServerValue.TIMESTAMP,
                    uid: auth.currentUser.uid 
                };

                feedbackRef.push(feedbackData)
                    .then(() => {
                        showStatus("Thank you for your feedback!", "success");
                        messageInput.value = ""; 
                    })
                    .catch(error => {
                        console.error("Firebase Write Error:", error);
                        showStatus("An error occurred. Please try again.", "error");
                    })
                    .finally(() => {
                        submitBtn.disabled = false;
                        submitBtn.textContent = "Send Feedback";
                    });
            });

            function displayFeedback(feedbacks) {
                feedbacks.forEach(data => {
                    const item = document.createElement("div");
                    item.className = "feedback-item";
                    item.innerHTML = `
                        <div class="feedback-header">
                            <strong>${escapeHTML(data.name)}</strong>
                            <span>${new Date(data.timestamp).toLocaleString()}</span>
                        </div>
                        <p>${escapeHTML(data.message)}</p>
                        ${data.reply ? `<div class="admin-reply"><strong>Admin Reply:</strong> ${escapeHTML(data.reply)}</div>` : ''}
                    `;
                    feedbackItemsContainer.appendChild(item);
                });
            }

            const backButton = document.querySelector(".back-to-dashboard");
            window.addEventListener("scroll", () => {
                backButton.classList.toggle("arrow", window.scrollY > 50);
            }, { passive: true });
        });
    </script>
</body>
</html>
