<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>404 - Page Not Found</title>
    
    <script>
      (function() {
        const savedTheme = localStorage.getItem('theme');
        const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (savedTheme) {
          document.documentElement.setAttribute('data-theme', savedTheme);
        } else {
          document.documentElement.setAttribute('data-theme', prefersDark ? 'dark' : 'light');
        }
      })();
    </script>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --font-primary: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            --transition-smooth: 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            --border-radius-main: 18px;
            --border-radius-small: 12px;
            --shadow-strong: 0 8px 32px rgba(0, 0, 0, 0.25);
            --backdrop-blur-value: 12px;
        }

        html[data-theme='light'] {
            --c-text-primary: #1d1d1f;
            --c-text-secondary: #515154;
            --c-text-accent: #007aff;
            --c-bg-glass: rgba(255, 255, 255, 0.7);
            --c-border-glass: rgba(60, 60, 67, 0.2);
            --c-bg-btn: #007aff;
            --c-text-btn: #ffffff;
        }

        html[data-theme='dark'] {
            --c-text-primary: #f5f5f7;
            --c-text-secondary: #8e8e93;
            --c-text-accent: #0a84ff;
            --c-bg-glass: rgba(28, 28, 30, 0.6);
            --c-border-glass: rgba(84, 84, 88, 0.5);
            --c-bg-btn: #0a84ff;
            --c-text-btn: #ffffff;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: var(--font-primary);
            
            background-size: cover;
            color: var(--c-text-primary);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 1rem;
        }

        .error-card {
            background: var(--c-bg-glass);
            backdrop-filter: blur(var(--backdrop-blur-value));
            border: 1px solid var(--c-border-glass);
            border-radius: var(--border-radius-main);
            box-shadow: var(--shadow-strong);
            padding: 2rem;
            max-width: 500px;
            width: 100%;
            text-align: center;
            opacity: 0;
            animation: fadeInUp 0.8s 0.2s ease-out forwards;
        }

        .error-image {
            width: 180px;
            height: auto;
            margin-bottom: 1.5rem;
        }

        h1 {
            font-size: clamp(5rem, 20vw, 7rem);
            font-weight: 900;
            color: var(--c-text-accent);
            line-height: 1;
            margin: 0;
        }
        
        h2 {
            font-size: 1.5rem;
            font-weight: 600;
            color: var(--c-text-primary);
            margin-top: 0.5rem;
            margin-bottom: 1rem;
        }

        p {
            color: var(--c-text-secondary);
            font-size: 1rem;
            line-height: 1.6;
            margin-bottom: 2rem;
        }

        .home-button {
            display: inline-block;
            text-decoration: none;
            background: var(--c-bg-btn);
            color: var(--c-text-btn);
            padding: 0.8rem 1.5rem;
            border-radius: var(--border-radius-small);
            font-weight: 600;
            transition: all var(--transition-smooth);
        }

        .home-button:hover {
            opacity: 0.85;
            transform: translateY(-3px);
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

    </style>
</head>
<body>
  <div class="error-card">
    <img class="error-image" src="https://res.cloudinary.com/ddkisbcrp/image/upload/f_auto,q_auto/v1/anime/cdapr7e0yukcqnzghn96" alt="Character looking lost">
    <h1>404</h1>
    <h2>Page Not Found</h2>
    <p>
        Looks like you've taken a wrong turn. The page you're looking for doesn't exist or has been moved.
    </p>
    <a href="/" class="home-button">Go Back Home</a>
  </div>
</body>
</html>
